<!doctype html>
<!-- Template for coding_tool.html, filled in by step06_export_for_coders.py -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claim coding</title>
<style>
 :root{--bg:#16181c;--panel:#1e2127;--panel2:#252931;--line:#343942;
       --ink:#e6e3de;--mut:#9aa1ad;--acc:#7aa2d6;--warn:#d9b25c;
       --a:#d9765c;--b:#d9b25c;--c:#6fa8d6;--na:#7d8592;--ok:#6f9e77}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);
   font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
 a{color:var(--acc)}
 .wrap{max-width:1320px;margin:0 auto;padding:18px 24px 40px}
 header{display:flex;justify-content:space-between;align-items:flex-start;
   gap:12px;border-bottom:1px solid var(--line);padding-bottom:11px;
   margin-bottom:12px}
 .hl{display:flex;flex-direction:column;gap:1px;line-height:1.35}
 h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.02em}
 .sp{flex:1}
 .tbtn{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:7px;
   border:1px solid var(--line);background:var(--panel);color:var(--mut);
   cursor:pointer}
 .tbtn:hover{border-color:var(--acc);color:var(--acc)}
 .tbtn{display:inline-flex;align-items:center;gap:6px;appearance:none;
   -webkit-appearance:none}
 button{appearance:none;-webkit-appearance:none}
 .who,.prog{font-size:12.5px;color:var(--mut)}
 .build{font-size:10.5px;color:var(--line);align-self:flex-start;
   font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-right:10px}
 .bar{height:3px;background:var(--line);border-radius:2px;margin-bottom:22px}
 .bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;
   transition:width .18s}
 .stmt{background:var(--panel);border:1px solid var(--line);border-radius:10px;
   padding:24px 26px;font-size:18.5px;line-height:1.55;margin-bottom:22px}
 .qh{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;
   color:var(--mut);margin:0 0 10px;font-weight:600}
 .opts{display:grid;gap:7px;margin-bottom:14px}
 table.pickt tr.pick{cursor:pointer}
 table.pickt tr.pick:hover td{background:var(--panel2)}
 table.pickt tr.pick.sel td{background:var(--panel2)}
 table.pickt tr.pick.sel td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
 table.pickt{margin-bottom:0}
 button.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;
   background:var(--panel);border:1px solid var(--line);border-radius:8px;
   padding:11px 14px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink);
   width:100%}
 button.opt:hover{border-color:var(--mut);background:var(--panel2)}
 button.opt.sel{border-color:var(--acc);background:var(--panel2);
   box-shadow:inset 0 0 0 1px var(--acc)}
 .k{font-weight:700;min-width:22px;font-size:15px}
 .A .k{color:var(--a)} .B .k{color:var(--b)} .C .k{color:var(--c)}
 .NA .k{color:var(--na);font-size:13px}
 .d{color:var(--mut);font-size:12.5px;display:block;margin-top:2px}
 .aux{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
 .chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);
   cursor:pointer;user-select:none;padding:6px 11px;border-radius:7px;
   border:1px solid var(--line);background:var(--panel)}
 .chk input{accent-color:var(--warn);width:14px;height:14px}
 .chk.on{border-color:var(--warn);color:var(--warn)}
 .alt{display:flex;gap:6px;align-items:center;margin:-4px 0 14px;font-size:13px}
 .altb{width:34px;height:30px;border-radius:7px;border:1px solid var(--line);
   background:var(--panel);color:var(--mut);cursor:pointer;font:inherit;
   font-size:13px}
 .altb:hover{border-color:var(--mut)}
 .altb.sel{border-color:var(--warn);color:var(--warn);
   box-shadow:inset 0 0 0 1px var(--warn)}
 .note{width:100%;background:var(--panel);border:1px solid var(--line);
   color:var(--ink);border-radius:8px;padding:9px 12px;font:inherit;
   font-size:13.5px;margin-bottom:16px;resize:vertical;min-height:38px}
 .note::placeholder{color:var(--mut)}
 .help{background:var(--panel2);border:1px solid var(--line);
   border-left:2px solid var(--acc);border-radius:0 8px 8px 0;padding:11px 16px;
   margin:10px 0 14px;font-size:13px}
 .help .hh{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;
   color:var(--mut);font-weight:600;margin:0 0 4px}
 .help li{margin:6px 0}
 .help b{color:var(--ink)}
 .help .sub{color:var(--mut)}
 .gl{width:13px;height:13px;vertical-align:-2px;stroke:currentColor;fill:none;
   stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .nav button{display:inline-flex;align-items:center;gap:7px}
 .nav{display:flex;gap:9px;align-items:center;border-top:1px solid var(--line);
   padding-top:14px;margin-top:4px}
 .nav button{font:inherit;padding:9px 18px;border-radius:8px;cursor:pointer;
   border:1px solid var(--line);background:var(--panel);color:var(--ink)}
 .nav button:hover:not(:disabled){border-color:var(--mut)}
 .nav button.pri{background:var(--acc);color:#12151a;border-color:var(--acc);
   font-weight:600}
 .nav button:disabled{opacity:.35;cursor:default}
 .map{margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
 .maph{font-size:11.5px;color:var(--mut);margin-bottom:9px;display:flex;
   gap:14px;align-items:center;flex-wrap:wrap}
 .dot{display:inline-block;width:9px;height:9px;border-radius:2px;
   margin-right:5px;vertical-align:-1px}
 .grid{line-height:0}
 .mapsvg{display:block;max-width:100%;height:auto}
 .mapsvg g{cursor:pointer}
 .mapsvg rect{stroke-width:1}
 .mapsvg text{font-family:inherit;font-size:10px;text-anchor:middle;
   dominant-baseline:central;pointer-events:none}
 .intro h2{font-size:15px;color:var(--ink);margin:26px 0 8px}
 .intro p,.intro li{font-size:14.5px}
 .sub{color:var(--mut)}
 .gl{width:13px;height:13px;vertical-align:-2px;stroke:currentColor;fill:none;
   stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .nav button{display:inline-flex;align-items:center;gap:7px}
 .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
   padding:16px 20px;margin:10px 0}
 .lv{margin:13px 0}.lv:first-child{margin-top:0}
 .lvh{font-weight:600}
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
   color:var(--acc)}
 .tblwrap{overflow-x:auto;padding:4px 8px}
 table.lvt{border-collapse:collapse;width:100%;font-size:13px;min-width:720px;
   table-layout:fixed}
 table.lvt col.c-key{width:48px} table.lvt col.c-name{width:15%}
 table.lvt col.c-about{width:13%} table.lvt col.c-def{width:40%}
 table.lvt col.c-ex{width:32%}
 table.lvt td.ex div{color:var(--acc);font-size:12.5px;line-height:1.45;
   padding-left:9px;border-left:2px solid var(--line);margin:0 0 6px}
 table.lvt td.ex div:last-child{margin-bottom:0}
 table.lvt td.def{line-height:1.5}
 table.lvt th{text-align:left;color:var(--mut);font-weight:600;font-size:12px;
   padding:8px 8px;border-bottom:1px solid var(--line)}
 table.lvt td{vertical-align:top;padding:9px 8px;border-bottom:1px solid var(--line)}
 table.lvt tr:last-child td{border-bottom:0}
 table.lvt td.mono{font-size:12px;line-height:1.5}
 input[type=text]{background:var(--panel2);border:1px solid var(--line);
   color:var(--ink);border-radius:8px;padding:10px 13px;font:inherit;width:260px}
 .done{text-align:center;padding:40px 0}
 kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
   padding:1px 6px;font-size:12px;color:var(--mut)}
 .overlay{position:fixed;inset:0;background:rgba(10,11,13,.72);display:none;
   z-index:9;backdrop-filter:blur(2px)}
 .overlay.on{display:block}
 .panel{position:fixed;top:0;right:0;bottom:0;width:min(620px,92vw);
   background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;
   padding:22px 26px 60px;z-index:10;transform:translateX(100%);
   transition:transform .18s}
 .panel.on{transform:none}
 .panel h2{margin-top:22px}
 .close{position:sticky;top:0;float:right;background:var(--panel);
   border:1px solid var(--line);color:var(--mut);border-radius:7px;
   padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
</style></head><body>
<div class="overlay" id="ov" onclick="panel(false)"></div>
<div class="panel" id="panel"></div>
<div class="wrap">
<header>
  <div class="hl">
    <h1>Claim coding</h1>
    <span class="who" id="who"></span>
    <span class="prog" id="prog"></span>
  </div>
  <span class="build" title="regenerate with step06_export_for_coders.py, then
reload with Cmd+Shift+R">__BUILD__</span>
  <button class="tbtn" onclick="panel(true)"><svg class="gl" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h5a2 2 0 0 1 2 2v8a2 2 0 0 0-2-2H3z"/><path d="M13 3H8a2 2 0 0 0-2 2v8a2 2 0 0 1 2-2h5z"/></svg>Instructions</button>
</header>
<div class="bar"><div id="fill"></div></div>
<div id="app"></div>
</div>
<script>
const TASKS = __TASKS__;
const SCOPE = __SCOPE__;
const VOCAB = __VOCAB__;
const AX    = {scope: SCOPE, vocabulary: VOCAB};
const EMAIL  = "__EMAIL__";
const UNSURE  = __UNSURE__;
const MASKTOK  = "__MASK__";
const PREAMBLE = __PREAMBLE__;
const STORE = "claimcoding_v4";   // storage key for saved answers
const svg = d => `<svg class="gl" viewBox="0 0 16 16" aria-hidden="true">${d}</svg>`;
const GL = {
  left:  svg('<path d="M10 3 5 8l5 5"/>'),
  right: svg('<path d="M6 3l5 5-5 5"/>'),
  book:  svg('<path d="M3 3h5a2 2 0 0 1 2 2v8a2 2 0 0 0-2-2H3z"/>'
             + '<path d="M13 3H8a2 2 0 0 0-2 2v8a2 2 0 0 1 2-2h5z"/>'),
  help:  svg('<circle cx="8" cy="8" r="6"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2 2.2V10"/>'
             + '<path d="M8.3 12.2h.01"/>'),
  flag:  svg('<path d="M4 14V3"/><path d="M4 3.5h7l-1.3 2.4L11 8.3H4z"/>'),
  down:  svg('<path d="M8 3v8"/><path d="M4.8 7.8 8 11l3.2-3.2"/><path d="M3 13.2h10"/>'),
};

let st = JSON.parse(localStorage.getItem(STORE) || "{}");
st.ans = st.ans || {}; st.i = st.i || 0; st.coder = st.coder || "";
st.started = st.started || false;
const save = () => localStorage.setItem(STORE, JSON.stringify(st));
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const nDone = () => TASKS.filter(t => (st.ans[t.tid]||{}).value).length;

/* ----------------------------------------------------------- level tables */
/* the level table; on a question, its rows are the answer options */
function levelCard(ax, pickable, chosen){
  return `<div class="card tblwrap"><table class="lvt${pickable ? " pickt" : ""}">
    <colgroup><col class="c-key"><col class="c-name"><col class="c-about">
      <col class="c-def"><col class="c-ex"></colgroup>
    <thead><tr>${ax.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
    <tbody>${ax.levels.map(l => `<tr${pickable ? ` class="pick ${l.key}${
        chosen === l.key ? " sel" : ""}" onclick="pick('${l.key}')"` : ""}>
      <td><span class="k ${l.key}">${l.key}</span></td>
      <td><b>${esc(l.name)}</b></td>
      <td>${esc(l.about)}</td>
      <td class="sub def">${esc(l.definition)}</td>
      <td class="ex">${l.examples.map(e => `<div>${esc(e)}</div>`).join("")}</td>
    </tr>`).join("")}</tbody></table></div>`;
}
function ruleCard(ax){
  return `<div class="card"><b style="font-size:13.5px">How to decide</b>
    <ul style="margin:8px 0 0;padding-left:18px">${ax.rules.map(r =>
      `<li style="font-size:13.5px"><b>${esc(r.name)}:</b>
       <span class="sub">${esc(r.text)}</span></li>`).join("")}</ul></div>`;
}
function rubricBlock(ax){
  return `<h2>${esc(ax.title)}</h2><p class="sub">${esc(ax.intro)}</p>
          ${levelCard(ax)}${ruleCard(ax)}`;
}

/* the instructions, for the start page and the Instructions panel */
function instructions(){
  const nScope = TASKS.filter(t => t.axis === "scope").length;
  const nVocab = TASKS.length - nScope;
  return `
   <h2 style="margin-top:6px">What you are doing</h2>
   <p>You will see ${TASKS.length} questions, one at a time and out of
   context, about statements taken from the titles and abstracts of
   neuroscience papers. A statement is one sentence or a few consecutive
   sentences. ${nScope} questions ask how far the claim <b>generalizes</b>;
   ${nVocab} ask what kind of <b>vocabulary</b> it uses. Some statements are
   asked about both, at different points in the queue: the vocabulary question
   then shows only the statement's main sentence, so its text can be shorter
   than when you saw it for the other question. Answer only the question on
   the screen, about the text on the screen. If a statement does not say what
   ${esc(MASKTOK)} does, choose the row <b>NA</b> in either table.</p>
   <p class="sub">${esc(PREAMBLE)}</p>
   <p class="sub">${esc(UNSURE)}</p>
   ${rubricBlock(SCOPE)}
   ${rubricBlock(VOCAB)}`;
}

function panel(on){
  const p = document.getElementById("panel");
  if (on) p.innerHTML =
    `<button class="close" onclick="panel(false)">Close</button>`
    + instructions();
  p.classList.toggle("on", on);
  document.getElementById("ov").classList.toggle("on", on);
}

/* ------------------------------------------------------------------ intro */
function renderIntro(){
  document.getElementById("app").innerHTML = `<div class="intro">
   ${instructions()}
   <p class="sub">Each question shows the level table and, below it, the
   decision rules. Use the <b>Instructions</b> button at the top to reopen this
   page at any time. You can go back and change any answer. Keyboard shortcuts work if
   you prefer them: the answer keys, <kbd>u</kbd> for unsure, and the arrow keys
   to move.</p>

   <h2>Your name</h2>
   <p class="sub">Recorded with your answers so codings can be told apart.</p>
   <p><input type="text" id="coder" placeholder="e.g. Anna B."
      value="${esc(st.coder)}"></p>
   <div class="nav"><span class="sp"></span>
     <button class="pri" onclick="start()">Start coding</button></div>
   <p class="sub" style="font-size:12.5px;margin-top:16px">Progress is saved in
   this browser, so you can close the page and come back.</p></div>`;
  document.getElementById("prog").textContent = "instructions";
  document.getElementById("fill").style.width = "0%";
  const inp = document.getElementById("coder");
  inp.focus();
  inp.addEventListener("keydown", e => { if (e.key === "Enter") start(); });
}
function start(){
  const v = document.getElementById("coder").value.trim();
  if (!v){ document.getElementById("coder").focus(); return; }
  st.coder = v; st.started = true; save(); render();
}

/* ------------------------------------------------------------------- map */
function mapHtml(){
  const S = 24, G = 4, PER = 10;
  const rows = Math.ceil(TASKS.length / PER);
  const w = PER * S + (PER - 1) * G;
  const h = rows * S + (rows - 1) * G;
  const FILL = {done: "#2b3a2f", uns: "#3a3323", none: "#1e2127"};
  const LINE = {done: "#3f5a46", uns: "#5a4d2e", none: "#343942"};
  const TEXT = {done: "#9fc2a8", uns: "#d9b25c", none: "#9aa1ad"};

  const cells = TASKS.map((t, n) => {
    const a = st.ans[t.tid] || {};
    const k = a.value ? (a.unsure ? "uns" : "done") : "none";
    const x = (n % PER) * (S + G);
    const y = Math.floor(n / PER) * (S + G);
    const now = n === st.i
      ? `<rect x="${x - 2}" y="${y - 2}" width="${S + 4}" height="${S + 4}"
           rx="7" fill="none" stroke="#7aa2d6" stroke-width="2"/>` : "";
    return `<g onclick="jump(${n})"><title>question ${n + 1}</title>
      <rect x="${x}" y="${y}" width="${S}" height="${S}" rx="5"
        fill="${FILL[k]}" stroke="${LINE[k]}"/>
      <text x="${x + S / 2}" y="${y + S / 2}" fill="${TEXT[k]}">${n + 1}</text>
      ${now}</g>`;
  }).join("");

  return `<div class="map"><div class="maph">
      <span><span class="dot" style="background:#2b3a2f;border:1px solid #3f5a46">
      </span>coded</span>
      <span><span class="dot" style="background:#3a3323;border:1px solid #5a4d2e">
      </span>coded, unsure</span>
      <span><span class="dot" style="background:#1e2127;
      border:1px solid #343942"></span>not yet</span>
      <span class="sp"></span></div>
    <div class="grid"><svg class="mapsvg" width="${w}" height="${h}"
      viewBox="-3 -3 ${w + 6} ${h + 6}" role="group"
      aria-label="progress map">${cells}</svg></div></div>`;
}

function jump(n){ st.i = n; save(); render(); }

/* ---------------------------------------------------------------- coding */
function render(){
  if (!st.started){ renderIntro(); return; }
  const app = document.getElementById("app");
  document.getElementById("who").textContent = st.coder + " · ";

  if (st.i >= TASKS.length){
    app.innerHTML = `<div class="done">
      <h2 style="font-size:17px">${nDone()} of ${TASKS.length} answered</h2>
      <p><button class="pri" style="font:inherit;padding:11px 22px;border:0;
        border-radius:8px;background:var(--acc);color:#12151a;font-weight:600;
        cursor:pointer;display:inline-flex;align-items:center;gap:8px"
        onclick="dl()">${GL.down}Download CSV</button></p>
      <p class="sub">Please email the downloaded file to<br>
        <a href="mailto:${EMAIL}?subject=Claim%20coding%20-%20${
          encodeURIComponent(st.coder)}">${EMAIL}</a></p>
      <p class="sub" style="font-size:12.5px">
        <a href="#" onclick="jump(0);return false">go back through the answers</a>
        &nbsp;·&nbsp;
        <a href="#" onclick="panel(true);return false">reread the instructions</a>
      </p></div>${mapHtml()}`;
    document.getElementById("prog").textContent = "complete";
    document.getElementById("fill").style.width = "100%";
    return;
  }

  const t = TASKS[st.i], ax = AX[t.axis], a = st.ans[t.tid] || {};
  app.innerHTML = `
    <div class="stmt">${esc(t.text)}</div>
    <p class="qh">${esc(ax.title)}</p>
    ${levelCard(ax, true, a.value)}
    <div class="help">
      <p class="hh">Decision rules</p>
      <ul style="margin:0;padding-left:18px">${ax.rules.map(r =>
        `<li><b>${esc(r.name)}:</b> <span class="sub">${esc(r.text)}</span></li>`
      ).join("")}</ul></div>
    <div class="aux">
      <label class="chk${a.unsure ? " on" : ""}">
        <input type="checkbox" ${a.unsure ? "checked" : ""}
          onchange="flag(this.checked)"> ${GL.flag} unsure
      </label>
    </div>
    ${a.unsure ? `<div class="alt"><span class="sub">weighed against:</span>
      ${ax.levels.filter(l => l.key !== a.value).map(l => `
        <button class="altb${a.alt === l.key ? " sel" : ""}"
          onclick="setAlt('${l.key}')">${l.key}</button>`).join("")}
      </div>` : ""}
    <textarea class="note" placeholder="note (optional)"
      oninput="setNote(this.value)">${esc(a.note || "")}</textarea>
    <div class="nav">
      <button onclick="go(-1)" ${st.i === 0 ? "disabled" : ""}>${GL.left}Back</button>
      <span class="sp"></span>
      <button onclick="go(1)">Skip</button>
      <button class="pri" onclick="go(1)" ${a.value ? "" : "disabled"}>Next${GL.right}</button>
    </div>
    ${mapHtml()}`;
  document.getElementById("prog").textContent =
    `${st.i + 1} / ${TASKS.length} · ${nDone()} answered`;
  document.getElementById("fill").style.width =
    (100 * st.i / TASKS.length).toFixed(1) + "%";
}

function upd(patch){
  const tid = TASKS[st.i].tid;
  st.ans[tid] = Object.assign({}, st.ans[tid], patch);
  save();
}
function pick(v){
  const a = st.ans[TASKS[st.i].tid] || {};
  upd(a.alt === v ? {value: v, alt: ""} : {value: v});
  render();
}
function flag(on){ upd(on ? {unsure: true} : {unsure: false, alt: ""}); render(); }
function setAlt(v){
  const a = st.ans[TASKS[st.i].tid] || {};
  upd({alt: a.alt === v ? "" : v}); render();
}
function setNote(v){ upd({note: v}); }
function go(d){ st.i = Math.max(0, st.i + d); save(); render(); }

document.addEventListener("keydown", e => {
  if (!st.started || st.i >= TASKS.length) return;
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const ax = AX[TASKS[st.i].axis], k = e.key.toLowerCase();
  const hit = ax.levels.find(l => l.key.toLowerCase() === k
                               || (l.key === "NA" && k === "n"));
  if (hit) pick(hit.key);
  else if (k === "u") flag(!(st.ans[TASKS[st.i].tid] || {}).unsure);
  else if (k === "escape") panel(false);
  else if (k === "arrowright" || k === "enter") go(1);
  else if (k === "arrowleft") go(-1);
});

function dl(){
  const by = {};
  TASKS.forEach(t => {
    const a = st.ans[t.tid]; if (!a || !a.value) return;
    const [pid, loc] = t.sid.split("|");
    by[t.sid] = by[t.sid] || {paper_id: pid, location: loc};
    // NA: no code, flagged instead
    by[t.sid][t.axis] = a.value === "NA" ? "" : a.value;
    by[t.sid][t.axis + "_not_scorable"] = a.value === "NA" ? 1 : 0;
    by[t.sid][t.axis + "_unsure"] = a.unsure ? 1 : 0;
    by[t.sid][t.axis + "_alt"] = a.alt || "";
    by[t.sid][t.axis + "_note"] = (a.note || "").replace(/[\r\n]+/g, " ");
  });
  const cols = ["paper_id","location","scope","vocabulary",
                "scope_unsure","vocabulary_unsure","scope_alt","vocabulary_alt",
                "scope_not_scorable","vocabulary_not_scorable",
                "scope_note","vocabulary_note","coder_id"];
  const q = v => `"${String(v == null ? "" : v).replace(/"/g,'""')}"`;
  const rows = [cols.join(",")];
  Object.values(by).forEach(r => {
    r.coder_id = st.coder;
    rows.push(cols.map(c => q(r[c] === undefined ? "" : r[c])).join(","));
  });
  const url = URL.createObjectURL(
    new Blob([rows.join("\n")], {type:"text/csv"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = "human_coding_" + st.coder.replace(/[^A-Za-z0-9]+/g,"_") + ".csv";
  a.click();
}
render();
</script></body></html>
